{% extends 'base.html' %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="text-center mb-4">

            <h1>Create Account</h1>

            <p>
                Join EduGuide and start your admission journey.
            </p>

        </div>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter username"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       placeholder="Enter email"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter password"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Confirm Password
                </label>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       placeholder="Confirm password"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">
                Create Account
            </button>

        </form>

        <p class="text-center mt-4">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</section>

{% endblock %}
