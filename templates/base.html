{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduGuide</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <!-- Logo -->

        <a class="navbar-brand d-flex align-items-center"
           href="{% url 'index' %}">

            <img src="{% static 'images/EduGuide Logo.png' %}"
                 alt="EduGuide Logo"
                 class="navbar-logo">

            <span class="ms-2 fw-bold brand-text">
                EduGuide
            </span>

        </a>


        <!-- Mobile Toggle -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- Navbar -->

        <div class="collapse navbar-collapse justify-content-center"
             id="navbarNav">

            <ul class="navbar-nav">


                <!-- HOME -->

                <li class="nav-item">

                    <a class="nav-link
                        {% if request.resolver_match.url_name == 'index' %}
                            active
                        {% endif %}"
                       href="{% url 'index' %}">

                        Home

                    </a>

                </li>


                <!-- COLLEGES DROPDOWN -->

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle
                        {% if request.resolver_match.url_name == 'colleges' or request.resolver_match.url_name == 'courses' %}
                            active-dropdown
                        {% endif %}"
                       href="#"
                       id="collegeDropdown"
                       role="button"
                       data-bs-toggle="dropdown"
                       aria-expanded="false">

                        Colleges

                    </a>


                    <ul class="dropdown-menu shadow border-0 rounded-4"
                        aria-labelledby="collegeDropdown">

                        <li>

                            <a class="dropdown-item py-2
                                {% if request.resolver_match.url_name == 'colleges' %}
                                    active
                                {% endif %}"
                               href="{% url 'colleges' %}">

                                Explore Colleges

                            </a>

                        </li>


                        <li>

                            <a class="dropdown-item py-2
                                {% if request.resolver_match.url_name == 'courses' %}
                                    active
                                {% endif %}"
                               href="{% url 'courses' %}">

                                Explore Courses

                            </a>

                        </li>

                    </ul>

                </li>


                <!-- CUTOFF -->

                <li class="nav-item">

                    <a class="nav-link
                        {% if request.resolver_match.url_name == 'cutoff' %}
                            active
                        {% endif %}"
                       href="{% url 'cutoff' %}">

                        Cutoff

                    </a>

                </li>


                <!-- PREDICTION -->

                <li class="nav-item">

                    <a class="nav-link
                        {% if request.resolver_match.url_name == 'prediction' %}
                            active
                        {% endif %}"
                       href="{% url 'prediction' %}">

                        Prediction

                    </a>

                </li>


                <!-- ABOUT -->

                <li class="nav-item">

                    <a class="nav-link
                        {% if request.resolver_match.url_name == 'about' %}
                            active
                        {% endif %}"
                       href="{% url 'about' %}">

                        About

                    </a>

                </li>

            </ul>

        </div>


        <!-- Login / Register / Logout -->

        {% if user.is_authenticated %}

            <span class="me-3 fw-semibold">
                Hi, {{ user.username }}
            </span>

            <form method="POST"
                  action="{% url 'logout' %}"
                  class="d-inline">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-outline-danger rounded-pill px-4">

                    Logout

                </button>

            </form>

        {% else %}

            <a href="{% url 'login' %}"
               class="btn btn-outline-primary rounded-pill px-4 me-2">

                Login

            </a>

            <a href="{% url 'register' %}"
               class="btn btn-primary rounded-pill px-4">

                Register

            </a>

        {% endif %}

    </div>

</nav>

    <!-- Page Content -->

    {% block content %}

    {% endblock %}

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
